[pytest]
# Configuração do pytest
# Nota: Este arquivo está dentro de tests/, mas o pytest ainda funciona
# quando executado da raiz do projeto
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

markers =
    unit: Testes unitários
    integration: Testes de integração
    slow: Testes que demoram para executar

